services:
  - type: web
    name: github-intelligence-api
    runtime: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn github_intelligence_mcp.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
